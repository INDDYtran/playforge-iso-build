# Playforge-Paketquelle
#
# Wird von playforge-repo-enable über /etc/pacman.conf eingebunden. Die
# Datenbank und alle Pakete sind mit dem Playforge-Repository-Schlüssel
# signiert; der öffentliche Schlüssel liegt unter
# /usr/share/playforge/pacman-repo.asc.
[playforge]
SigLevel = Required DatabaseRequired
Server = https://inddytran.github.io/playforge-iso-build/x86_64
