# Playforge – Gaming-Tuning
# Größerer Adressraum für Proton/Steam (Star Citizen, manche Unreal-Titel)
vm.max_map_count = 2147483642
# Weniger Swap-Nutzung, zram übernimmt
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.page-cluster = 0
# Viele Spiele/Launcher öffnen zahlreiche Dateien und Watcher
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192
fs.file-max = 2097152
# Netzwerk: fq + BBR für niedrigere Latenz
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
