[package]
name = "playforge-files"
version = "1.0.0"
edition = "2021"
rust-version = "1.81"
description = "Playforge Files – schlanker Dateibrowser für Playforge Linux"
license = "GPL-2.0-or-later"

[dependencies]
# Wie im Control Center: `glow` statt `wgpu`, Wayland und X11 gleichzeitig,
# damit die App auf Plasma (Wayland) und unter Xorg läuft.
eframe = { version = "0.31", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Nur für lokale Zeitstempel; die Formatierung passiert in `fs::format_time`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Bildvorschau. Bewusst ohne AVIF/EXR und ohne Rayon, um das Binary klein zu halten.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "webp",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
